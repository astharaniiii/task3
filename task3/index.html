<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Squid Game</title>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="main">

    <nav>

      <img src="logo.png" class="logo">

      <ul>
        <li>About</li>
        <li class="active">Watch now</li>
        <li>Actors</li>
        <li>Contact</li>
      </ul>

      <i class="fa-solid fa-bars"></i>

    </nav>

    <div class="hero">

      <div class="left">

        <img src="logo.png" class="title">

        <p>
          Action / Thriller / Drama Series directed by
          Dong-hyuk Hwang <br>
          Season 1: 9 Episodes
        </p>

        <div class="buttons">

          <button class="play">
            <i class="fa-solid fa-play"></i>
            Play Now
          </button>

          <button class="watch">
            <i class="fa-regular fa-circle-play"></i>
            Watch Trailer
          </button>

        </div>

      </div>

      <div class="scroll">

        <span>SCROLL</span>

        <div class="line"></div>

      </div>

      <div class="right">

        <img src="charactor.png" class="guard">

      </div>

      <div class="social">

        <i class="fa-brands fa-twitter"></i>
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-facebook-f"></i>

      </div>

    </div>

    <h1 class="bg-text">GAME</h1>
    <h1 class="bg-text-squid">SQUID</h1>

    <div class="cards">

      <div class="card">
        <img src="image-1.jpg">
      </div>

      <div class="card">
        <img src="image-2.jpg">
      </div>

      <div class="card">
        <img src="image-3.jpg">
      </div>

    </div>

  </section>

</body>
</html>
